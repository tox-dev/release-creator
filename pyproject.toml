[build-system]
build-backend = "hatchling.build"
requires = [ "hatch-fancy-pypi-readme>=25.1", "hatch-vcs>=0.5", "hatchling>=1.32.4" ]

[project]
name = "release-creator"
import-names = [ "release_creator" ]
description = "Release preparation tools for changelogs and GitHub"
keywords = [ "changelog", "GitHub releases", "release automation", "release notes", "towncrier" ]
license = "MIT"
license-files = [ "LICENSE" ]
authors = [ { name = "Bernát Gábor", email = "gaborjbernat@gmail.com" } ]
requires-python = ">=3.15"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.15",
  "Topic :: Documentation",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Software Development :: Version Control :: Git",
  "Typing :: Typed",
]
dynamic = [ "readme", "version" ]
dependencies = [
  "docutils>=0.22",
  "markdown-it-py>=4,<5",
  "mdformat>=1,<2",
  "mdformat-gfm>=1,<2",
  "packaging>=26",
  "pyyaml>=6",
  "towncrier>=26.9"
]
urls.Changelog = "https://release-creator.readthedocs.io/en/latest/changelog.html"
urls.Documentation = "https://release-creator.readthedocs.io/"
urls.Homepage = "https://release-creator.readthedocs.io/"
urls.Source = "https://github.com/tox-dev/release-creator"
urls.Tracker = "https://github.com/tox-dev/release-creator/issues"
scripts.release-creator = "release_creator.cli:main"

[dependency-groups]
dev = [ { include-group = "test" }, { include-group = "type" }, { include-group = "pkg-meta" } ]
test = [
  "covdefaults>=2.3",
  "diff-cover>=10.2",
  "graphql-core>=3",
  "pytest>=9",
  "pytest-cov>=7",
  "pytest-mock>=3.16",
  "pytest-xdist>=3",
  "towncrier>=26.9",
]
type = [ "ty>=0.0.84", { include-group = "test" }, { include-group = "docs" } ]
docs = [
  "furo>=2025.12.19",
  "sphinx>=9.1",
  "sphinx-argparse-cli>=1.24",
  "sphinx-copybutton>=0.5.2",
  "sphinxcontrib-mermaid>=2.1.1",
]
build = [
  "cython>=3",
  "hatch-fancy-pypi-readme>=25.1",
  "hatch-vcs>=0.5",
  "hatchling>=1.32.4",
  "setuptools>=80",
]
fix = [ "prek>=0.2" ]
pkg-meta = [ "check-wheel-contents>=0.6.3", "twine>=7", "uv>=0.12.22" ]
release-news = [
  "release-creator>=4.1",
  "towncrier>=26.9",
]
release-notes = [
  "release-creator>=4.1",
]
release-prepare = [
  "prek>=0.5",
  "release-creator>=4.1",
  "towncrier>=26.9",
]

[tool.hatch]
version.source = "vcs"
version.fallback-version = "0.1.0"
metadata.hooks.fancy-pypi-readme.content-type = "text/markdown"
metadata.hooks.fancy-pypi-readme.fragments = [ { path = "README.md" } ]
metadata.hooks.fancy-pypi-readme.substitutions = [
  { pattern = '''(?x)
    \]\(                                   # Markdown image target
    (?P<path>docs/_static/logo-128\.png)  # Logo path
    \)                                     # Target end
    ''', replacement = '](https://raw.githubusercontent.com/tox-dev/release-creator/main/\g<path>)' },
  { pattern = '''(?x)
    \]\(                     # Markdown link start
    (?!https?://|\#)          # Leave remote and fragment links unchanged
    (?P<path>[^)]+)           # Repository-relative path
    \)                       # Markdown link end
    ''', replacement = '](https://github.com/tox-dev/release-creator/blob/main/\g<path>)' },
]

[tool.ruff]
line-length = 120
format.preview = true
lint.select = [ "ALL" ]
lint.ignore = [
  "CPY",
  # Ruff's DOC parser does not recognize Sphinx fields; pydoclint checks them.
  "docstring-missing-exception",
  "docstring-missing-returns",
  "docstring-missing-yields",
  "incorrect-blank-line-before-class",
  "missing-trailing-comma",
  "multi-line-summary-second-line",
  "single-line-implicit-string-concatenation",
]
lint.per-file-ignores."tests/**/*.py" = [
  "assert",
  "D",
  "FBT",
  "implicit-namespace-package",
]
lint.preview = true

[tool.pytest]
addopts = [ "--import-mode=importlib" ]
testpaths = [ "tests" ]

[tool.coverage]
run.plugins = [ "covdefaults" ]
report.fail_under = 100

[tool.towncrier]
name = "release-creator"
directory = "changelog.d"
filename = "docs/changelog.rst"
template = "release_creator.fragments:template.rst.jinja2"
title_format = false
underlines = [ "-", "~", "^" ]
orphan_prefix = "+"
type = [
  { directory = "feature", name = "Added", showcontent = true },
  { directory = "change", name = "Changes", showcontent = true },
  { directory = "bugfix", name = "Fixed", showcontent = true },
  { directory = "doc", name = "Documentation", showcontent = true },
  { directory = "breaking", name = "Breaking changes", showcontent = true },
  { directory = "security", name = "Security", showcontent = true },
  { directory = "performance", name = "Performance", showcontent = true },
  { directory = "deprecation", name = "Deprecated", showcontent = true },
  { directory = "removal", name = "Removed", showcontent = true },
  { directory = "packaging", name = "Packaging", showcontent = true },
]
issue_pattern = "\\d+"

[tool.nab]
mode = "universal"
base-group = "project-runtime"
uploaded-prior-to = "P7D"
decision-order = "stable"
matrix.python = ">=3.15,<3.16"
matrix.platforms = [ "linux_x86_64" ]
# temporary, delete after 2026-11-02
packages.release-creator.uploaded-prior-to = 2026-10-26T18:24:46Z
