name: Prepare release
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump type
        required: true
        type: choice
        options:
          - auto
          - major
          - minor
          - patch
          - calver
        default: auto
permissions: {}
concurrency:
  group: prepare-release
  cancel-in-progress: false
jobs:
  assemble:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.15"
          enable-cache: false
      - name: Calculate next version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          version=$(git tag --list | uv run --no-default-groups release-creator tags --next "$BUMP")
          echo "Next version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build release patch
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git tag --list | uv run --no-default-groups release-creator tags "$VERSION" --require-newer
          uv run --no-default-groups release-creator fragments --repository "$GITHUB_REPOSITORY" --git --resolve-authors
          uv run --no-default-groups --group release towncrier build --yes --version "$VERSION"
          uvx prek exec mdformat -- mdformat --wrap 120 docs/changelog.md
          uv run --no-default-groups release-creator notes --changelog docs/changelog.md --tag "$VERSION" --repository "$GITHUB_REPOSITORY" > "$RUNNER_TEMP/release-notes.md"
          uvx prek run --all-files
          git diff HEAD --binary > "$RUNNER_TEMP/release.patch"
          test -s "$RUNNER_TEMP/release.patch"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-patch
          path: ${{ runner.temp }}/release.patch
          if-no-files-found: error
  push:
    needs: assemble
    runs-on: ubuntu-26.04
    environment: release-auth
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-patch
          path: ${{ runner.temp }}/release-patch
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.15"
          enable-cache: false
      - name: Validate release patch
        env:
          VERSION: ${{ needs.assemble.outputs.version }}
        run: |
          set -euo pipefail
          git fetch origin main
          if [[ $(git rev-parse origin/main) != "$GITHUB_SHA" ]]; then
            echo "::error::main changed during release preparation; dispatch again"
            exit 1
          fi
          git reset --hard origin/main
          git apply --check "$RUNNER_TEMP/release-patch/release.patch"
          git apply --index "$RUNNER_TEMP/release-patch/release.patch"
          while IFS= read -r path; do
            case "$path" in
              docs/changelog.md|changelog.d/*.md) ;;
              *) echo "::error::unexpected release path: $path"; exit 1 ;;
            esac
          done < <(git diff --cached --name-only)
          grep -Fq "## $VERSION (" docs/changelog.md
          git diff --cached --check
          uvx prek run --all-files
          if ! git diff --quiet || [[ -n $(git ls-files --others --exclude-standard) ]]; then
            echo "::error::prek changed the validated release patch; inspect the generated changelog and rerun"
            exit 1
          fi
      - id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - name: Commit and tag the release
        env:
          VERSION: ${{ needs.assemble.outputs.version }}
          GH_TOKEN: ${{ steps.token.outputs.token }}
          APP_SLUG: ${{ steps.token.outputs.app-slug }}
        run: |
          set -euo pipefail
          app_user_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${app_user_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git commit -m "release $VERSION"
          git tag "$VERSION"
          gh auth setup-git --hostname github.com --force
          git push --atomic origin HEAD:main "refs/tags/$VERSION"
