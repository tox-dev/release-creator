name: Prepare release
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump type
        required: true
        type: choice
        options:
          - auto
          - major
          - minor
          - patch
        default: auto
permissions: {}
jobs:
  prepare:
    uses: tox-dev/github-workflows/.github/workflows/prepare-towncrier-release.yaml@8269cd84ea994e179069a92150ab1710a03226d0
    permissions:
      contents: read
      pull-requests: read
    with:
      bump: ${{ inputs.bump }}
      local-tool-source: true
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
