name: Recheck hook cooldown
on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
permissions: {}
concurrency:
  group: recheck-hook-cooldown-${{ github.ref }}
  cancel-in-progress: true
jobs:
  recheck:
    runs-on: ubuntu-26.04
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - uses: tox-dev/github-workflows/recheck-hook-update-cooldown@076d3877b49d06f19fe2588eeacf76d37b21ebd7 # v4.0.1
        with:
          job-name: hook-update-cooldown
