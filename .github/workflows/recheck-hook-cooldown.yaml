name: Recheck hook cooldown
on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
permissions: {}
concurrency:
  group: recheck-hook-cooldown-${{ github.ref }}
  cancel-in-progress: true
jobs:
  recheck:
    runs-on: ubuntu-26.04
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - uses: tox-dev/github-workflows/recheck-hook-update-cooldown@13c5d50919f11fe2988b41a0acee48ca2488c1d6 # v3.0.1
        with:
          job-name: hook-update-cooldown
