name: Recheck hook cooldown
on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
permissions: {}
concurrency:
  group: recheck-hook-cooldown-${{ github.ref }}
  cancel-in-progress: true
jobs:
  recheck:
    runs-on: ubuntu-26.04
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - uses: tox-dev/github-workflows/recheck-hook-update-cooldown@3f37d2e43f40445bc4c07b6197067e6b7a762e95 # v4.0.0
        with:
          job-name: hook-update-cooldown
