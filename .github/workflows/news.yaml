name: Changelog
on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]
permissions:
  contents: read
jobs:
  changelog:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # zizmor: ignore[cache-poisoning] Check jobs hold no release credential and publish no artifact.
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2 # zizmor: ignore[cache-poisoning]
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
      - name: Install release-creator from source
        run: |
          uv sync --no-default-groups --group release-prepare
          echo "$PWD/.venv/bin" >>"$GITHUB_PATH"
      - uses: tox-dev/github-workflows/validate-news@3f37d2e43f40445bc4c07b6197067e6b7a762e95 # v4.0.0
      - name: Require releasable version
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          fragments=$(release-creator validate-news --base "$BASE_REF")
          if ((fragments)); then
            git tag --list | release-creator tags --next auto
          fi
