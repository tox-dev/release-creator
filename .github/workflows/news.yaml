name: Changelog
on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]
permissions:
  contents: read
jobs:
  changelog:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # zizmor: ignore[cache-poisoning] Check jobs hold no release credential and publish no artifact.
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2 # zizmor: ignore[cache-poisoning]
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
      - name: Validate release news
        id: news
        env:
          BASE_REF: ${{ github.base_ref }}
          SKIP_NEWS: ${{ contains(github.event.pull_request.labels.*.name, 'skip news') }}
          BOT_AUTHOR: ${{ github.event.pull_request.user.type == 'Bot' }}
        run: |
          set -euo pipefail
          fragments=$(uv run --no-default-groups --group release-prepare release-creator validate-news --base "$BASE_REF")
          if ((fragments)); then
            echo 'fragment=true' >> "$GITHUB_OUTPUT"
          elif [[ "$SKIP_NEWS" != true && "$BOT_AUTHOR" != true ]]; then
            echo '::error::add a changelog fragment or apply the skip news label'
            exit 1
          fi
      - name: Require releasable version
        if: steps.news.outputs.fragment == 'true'
        run: git tag --list | uv run --no-default-groups --group release-prepare release-creator tags --next auto
