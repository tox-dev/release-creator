name: Changelog
on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]
permissions:
  contents: read
jobs:
  changelog:
    name: 📝 News fragment
    runs-on: ubuntu-26.04
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # zizmor: ignore[cache-poisoning] Check jobs hold no release credential and publish no artifact.
      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2 # zizmor: ignore[cache-poisoning]
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
      # The released release-creator from pylock.toml checks this checkout, which it never runs.
      - name: 📦 Install locked release tools
        uses: tox-dev/github-workflows/install-locked-tools@259a3d3fb578d00517ffb73341fdd463259b0b2f # 6.0.1
        with:
          groups: release-news
          venv: ${{ runner.temp }}/release-tools
      - name: 🔍 Validate changelog fragments
        uses: tox-dev/github-workflows/validate-news@259a3d3fb578d00517ffb73341fdd463259b0b2f # 6.0.1
