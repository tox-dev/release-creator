name: Release to PyPI
on:
  push:
    tags: ["*"]
permissions: {}
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    uses: tox-dev/github-workflows/.github/workflows/validate-python-release.yaml@55f51f9b5cc0b40f280155a95de2d4f0ecbf7be1 # v3.0.0
    permissions:
      contents: read
  previous:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.previous }}
      commit: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - uses: tox-dev/github-workflows/install-locked-tools@55f51f9b5cc0b40f280155a95de2d4f0ecbf7be1 # v3.0.0
        with:
          groups: project-runtime
          venv: ${{ runner.temp }}/release-tools
      - id: tag
        name: Find previous release tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          previous=$(git tag --list | PYTHONPATH=src "$RUNNER_TEMP/release-tools/bin/python" \
            -m release_creator tags "$TAG" --previous)
          echo "previous=$previous" >>"$GITHUB_OUTPUT"
  contributors:
    needs: previous
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: Generate contributor metadata
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PREVIOUS: ${{ needs.previous.outputs.tag }}
        run: |
          if [[ -n "$PREVIOUS" ]]; then
            gh api -X POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f "tag_name=$TAG" -f "previous_tag_name=$PREVIOUS" --jq .body >"$RUNNER_TEMP/generated-notes.md"
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f "tag_name=$TAG" --jq .body >"$RUNNER_TEMP/generated-notes.md"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: generated-notes
          path: ${{ runner.temp }}/generated-notes.md
          if-no-files-found: error
  notes:
    needs: [build, contributors, previous]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: generated-notes
          path: ${{ runner.temp }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-distributions
          path: dist
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - uses: tox-dev/github-workflows/install-locked-tools@55f51f9b5cc0b40f280155a95de2d4f0ecbf7be1 # v3.0.0
        with:
          groups: release-notes project-runtime
          venv: ${{ runner.temp }}/release-tools
          local-tool-source: "true"
      - name: Install tagged release-creator
        run: |
          uv pip install --python "$RUNNER_TEMP/release-tools/bin/python" --no-deps dist/release_creator-*.whl
          echo "$RUNNER_TEMP/release-tools/bin" >>"$GITHUB_PATH"
      - uses: tox-dev/github-workflows/render-release-notes@55f51f9b5cc0b40f280155a95de2d4f0ecbf7be1 # v3.0.0
        with:
          tag: ${{ github.ref_name }}
          previous: ${{ needs.previous.outputs.tag }}
          changelog: docs/changelog.rst
          artifact-url: https://pypi.org/project/release-creator/${{ github.ref_name }}/
          generated-notes: ${{ runner.temp }}/generated-notes.md
          output: ${{ runner.temp }}/release-notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: final-github-release-notes
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error
  publish-pypi:
    needs: [build, notes]
    runs-on: ubuntu-26.04
    environment:
      name: release
      url: https://pypi.org/project/release-creator/${{ github.ref_name }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          attestations: true
          packages-dir: dist
          skip-existing: true
  verify-pypi:
    needs: publish-pypi
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-distributions
          path: dist
      - uses: tox-dev/github-workflows/reconcile-pypi-artifacts@55f51f9b5cc0b40f280155a95de2d4f0ecbf7be1 # v3.0.0
        with:
          project: release-creator
          version: ${{ github.ref_name }}
          dist: dist
  github-release:
    needs: [previous, notes, verify-pypi]
    runs-on: ubuntu-26.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: final-github-release-notes
          path: ${{ runner.temp }}
      - uses: tox-dev/github-workflows/publish-github-release@55f51f9b5cc0b40f280155a95de2d4f0ecbf7be1 # v3.0.0
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          tag: ${{ github.ref_name }}
          commit: ${{ needs.previous.outputs.commit }}
          title: v${{ github.ref_name }}
          notes-file: ${{ runner.temp }}/release-notes.md
