name: Release to PyPI
on:
  push:
    tags: ["*"]
permissions: {}
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    name: 🏗️ Build and validate distributions
    uses: tox-dev/github-workflows/.github/workflows/validate-python-release.yaml@522076eaf6fa1e6ecb26322be5252973cd466357 # v6.0.0
    permissions:
      contents: read
  previous:
    name: 🏷️ Select previous tag
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.previous }}
      commit: ${{ github.sha }}
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - name: 📦 Install locked release tools
        uses: tox-dev/github-workflows/install-locked-tools@522076eaf6fa1e6ecb26322be5252973cd466357 # v6.0.0
        with:
          groups: release-notes
          venv: ${{ runner.temp }}/release-tools
      - name: 🏷️ Select previous tag
        id: tag
        uses: tox-dev/github-workflows/select-previous-tag@522076eaf6fa1e6ecb26322be5252973cd466357 # v6.0.0
        with:
          tag: ${{ github.ref_name }}
  notes:
    name: 📝 Render GitHub Release notes
    needs: previous
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      # The notes come from the previous release-creator in pylock.toml, never from the tagged checkout.
      - name: 📦 Install locked release tools
        uses: tox-dev/github-workflows/install-locked-tools@522076eaf6fa1e6ecb26322be5252973cd466357 # v6.0.0
        with:
          groups: release-notes
          venv: ${{ runner.temp }}/release-tools
      - name: 📝 Render release notes
        uses: tox-dev/github-workflows/render-release-notes@522076eaf6fa1e6ecb26322be5252973cd466357 # v6.0.0
        with:
          tag: ${{ github.ref_name }}
          previous: ${{ needs.previous.outputs.tag }}
          changelog: docs/changelog.rst
          artifact-url: https://pypi.org/project/release-creator/${{ github.ref_name }}/
      - name: 📤 Store release notes
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: final-github-release-notes
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error
  publish-pypi:
    name: 🚀 Publish to PyPI
    needs: [build, notes]
    runs-on: ubuntu-26.04
    environment:
      name: release
      url: https://pypi.org/project/release-creator/${{ github.ref_name }}/
    permissions:
      id-token: write
    steps:
      - name: 📩 Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.distributions-artifact-id }}
          path: dist
      - name: 🚀 Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          attestations: true
          packages-dir: dist
          skip-existing: true
  verify-pypi:
    name: 🔍 Verify PyPI distributions
    needs: [build, publish-pypi]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - name: 📩 Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.distributions-artifact-id }}
          path: dist
      - name: 🔍 Verify PyPI artifacts
        uses: tox-dev/github-workflows/reconcile-pypi-artifacts@522076eaf6fa1e6ecb26322be5252973cd466357 # v6.0.0
        with:
          project: release-creator
          version: ${{ github.ref_name }}
          dist: dist
  github-release:
    name: 🚀 Publish GitHub Release
    needs: [previous, notes, verify-pypi]
    runs-on: ubuntu-26.04
    environment: release
    permissions:
      contents: write
    steps:
      - name: 📩 Download release notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.notes.outputs.artifact-id }}
          path: ${{ runner.temp }}
      - name: 🚀 Publish GitHub release
        uses: tox-dev/github-workflows/publish-github-release@522076eaf6fa1e6ecb26322be5252973cd466357 # v6.0.0
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          tag: ${{ github.ref_name }}
          commit: ${{ needs.previous.outputs.commit }}
          title: v${{ github.ref_name }}
          notes-file: ${{ runner.temp }}/release-notes.md
