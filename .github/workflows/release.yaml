name: Release to PyPI
on:
  push:
    tags: ["*"]
permissions: {}
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    uses: tox-dev/github-workflows/.github/workflows/validate-python-release.yaml@076d3877b49d06f19fe2588eeacf76d37b21ebd7 # v4.0.1
    permissions:
      actions: read
      contents: read
      pull-requests: read
  previous:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.previous }}
      commit: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - uses: tox-dev/github-workflows/install-locked-tools@076d3877b49d06f19fe2588eeacf76d37b21ebd7 # v4.0.1
        with:
          groups: release-notes
          lock-source: shared
          venv: ${{ runner.temp }}/release-tools
      - id: tag
        uses: tox-dev/github-workflows/select-previous-tag@076d3877b49d06f19fe2588eeacf76d37b21ebd7 # v4.0.1
        with:
          tag: ${{ github.ref_name }}
  contributors:
    needs: previous
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Generate contributor metadata
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PREVIOUS: ${{ needs.previous.outputs.tag }}
        run: |
          if [[ -n "$PREVIOUS" ]]; then
            gh api -X POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f "tag_name=$TAG" -f "previous_tag_name=$PREVIOUS" --jq .body >"$RUNNER_TEMP/generated-notes.md"
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f "tag_name=$TAG" --jq .body >"$RUNNER_TEMP/generated-notes.md"
          fi
      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: generated-notes
          path: ${{ runner.temp }}/generated-notes.md
          if-no-files-found: error
  notes:
    needs: [contributors, previous]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.contributors.outputs.artifact-id }}
          path: ${{ runner.temp }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      # The notes come from the previous release-creator in the shared lock, never from the tagged checkout.
      - uses: tox-dev/github-workflows/install-locked-tools@076d3877b49d06f19fe2588eeacf76d37b21ebd7 # v4.0.1
        with:
          groups: release-notes
          lock-source: shared
          venv: ${{ runner.temp }}/release-tools
      - uses: tox-dev/github-workflows/render-release-notes@076d3877b49d06f19fe2588eeacf76d37b21ebd7 # v4.0.1
        with:
          tag: ${{ github.ref_name }}
          previous: ${{ needs.previous.outputs.tag }}
          changelog: docs/changelog.rst
          artifact-url: https://pypi.org/project/release-creator/${{ github.ref_name }}/
          generated-notes: ${{ runner.temp }}/generated-notes.md
      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: final-github-release-notes
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error
  publish-pypi:
    needs: [build, notes]
    runs-on: ubuntu-26.04
    environment:
      name: release
      url: https://pypi.org/project/release-creator/${{ github.ref_name }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.distributions-artifact-id }}
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          attestations: true
          packages-dir: dist
          skip-existing: true
  verify-pypi:
    needs: [build, publish-pypi]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.distributions-artifact-id }}
          path: dist
      - uses: tox-dev/github-workflows/reconcile-pypi-artifacts@076d3877b49d06f19fe2588eeacf76d37b21ebd7 # v4.0.1
        with:
          project: release-creator
          version: ${{ github.ref_name }}
          dist: dist
  github-release:
    needs: [previous, notes, verify-pypi]
    runs-on: ubuntu-26.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.notes.outputs.artifact-id }}
          path: ${{ runner.temp }}
      - uses: tox-dev/github-workflows/publish-github-release@076d3877b49d06f19fe2588eeacf76d37b21ebd7 # v4.0.1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          tag: ${{ github.ref_name }}
          commit: ${{ needs.previous.outputs.commit }}
          title: v${{ github.ref_name }}
          notes-file: ${{ runner.temp }}/release-notes.md
