name: Upgrade release tools
on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 2"
permissions: {}
concurrency:
  group: upgrade-release-tools
  cancel-in-progress: false
jobs:
  upgrade:
    uses: tox-dev/github-workflows/.github/workflows/upgrade-release-tools.yaml@6657e5374d3aa63fb5a3890279ada74ea336b97c
    permissions:
      contents: read
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
    with:
      lock-groups: lock-tools release-check release-notes release-prepare release-validate
