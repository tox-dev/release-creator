name: Upgrade release tools
on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 2"
permissions: {}
concurrency:
  group: upgrade-release-tools
  cancel-in-progress: false
jobs:
  upgrade:
    name: 🔀 Upgrade release tools
    uses: tox-dev/github-workflows/.github/workflows/upgrade-release-tools.yaml@522076eaf6fa1e6ecb26322be5252973cd466357 # v6.0.0
    permissions:
      contents: read
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
