name: Validate release
on:
  workflow_call:
permissions: {}
jobs:
  validate:
    uses: tox-dev/github-workflows/.github/workflows/validate-python-release.yaml@a250ca3524857236e288764651851010939b6f71
    permissions:
      contents: read
      pull-requests: read
    with:
      changelog: docs/changelog.md
      fragments: changelog.d
      format: markdown
      artifact-base-url: https://pypi.org/project/release-creator/
      local-tool-source: true
