name: Validate release
on:
  workflow_call:
permissions: {}
jobs:
  validate:
    uses: tox-dev/github-workflows/.github/workflows/validate-python-release.yaml@e00d0861b72495aa77e183b17def18c40de0abc9
    permissions:
      contents: read
      pull-requests: read
    with:
      changelog: docs/changelog.md
      fragments: changelog.d
      format: markdown
      artifact-base-url: https://pypi.org/project/release-creator/
      local-tool-source: true
