name: Validate release
on:
  workflow_call:
permissions: {}
jobs:
  validate:
    uses: tox-dev/github-workflows/.github/workflows/validate-python-release.yaml@8db87d4730353b61630d66cbc592d6bed0c85d2b
    permissions:
      contents: read
      pull-requests: read
    with:
      changelog: docs/changelog.md
      fragments: changelog.d
      format: markdown
      artifact-base-url: https://pypi.org/project/release-creator/
      local-tool-source: true
