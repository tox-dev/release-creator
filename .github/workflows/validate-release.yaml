name: Validate release
on:
  workflow_call:
permissions: {}
jobs:
  validate:
    uses: tox-dev/github-workflows/.github/workflows/validate-python-release.yaml@8dcf033f9c58bfa39916fc57b2723383640970c0
    permissions:
      contents: read
      pull-requests: read
    with:
      changelog: docs/changelog.md
      fragments: changelog.d
      format: markdown
      artifact-base-url: https://pypi.org/project/release-creator/
      local-tool-source: true
