name: Validate release
on:
  workflow_call:
permissions: {}
jobs:
  validate:
    uses: tox-dev/github-workflows/.github/workflows/validate-python-release.yaml@e8d429040f73cd95af722543a0a09717bf3bb0aa
    permissions:
      contents: read
      pull-requests: read
    with:
      changelog: docs/changelog.md
      fragments: changelog.d
      format: markdown
      artifact-base-url: https://pypi.org/project/release-creator/
      local-tool-source: true
